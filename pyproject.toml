[project]
name = "coin_trader"
authors = [
    { name = "Dexciss Technology", email = "rkrohankumbhar@gmail.com" }
]
description = "AI + ML Powered CoinDCX Trading Platform"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "lightgbm>=4.3.0",
    "pandas>=2.2.0",
    "ta>=0.11.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "httpx>=0.27.0",
    "python-socketio[client]>=5.11.0",
    "websockets>=12.0",
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    "openai>=1.30.0",
    "python-telegram-bot>=21.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "coin_trader"
